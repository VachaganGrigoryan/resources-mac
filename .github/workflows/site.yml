name: Site

# The website goes live when a release is published, so it never advertises a cask or dmg
# that isn't downloadable yet. Pull requests still get Vercel preview deploys; main itself
# no longer deploys on push (vercel.json `git.deploymentEnabled`).
on:
  release:
    types: [published]
  # Redeploy by hand, e.g. for a copy fix between releases.
  workflow_dispatch:

concurrency:
  group: site-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://resources.vachagan.dev
    steps:
      - uses: actions/checkout@v4
        with:
          # The release's tag, or the branch chosen when run by hand.
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Check Vercel secrets
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!s}" ] || { echo "::error::Repository secret $s is not set"; exit 1; }
          done
      - run: npm install --global vercel@62.4.0
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
