name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256_resources: ${{ steps.bundle.outputs.sha256_resources }}
      sha256_sweep: ${{ steps.bundle.outputs.sha256_sweep }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "resources-mac") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Bundle universal apps and dmgs
        id: bundle
        # Explicit bash adds pipefail; a failed bundle must never yield an empty sha256 in a cask.
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/bundle.sh "$VERSION" > dist.sums
          for pair in resources-mac:resources disk-sweep:sweep; do
            slug=${pair%%:*} key=${pair##*:}
            line=$(grep "  $slug-$VERSION.dmg$" dist.sums) || { echo "::error::no sha256 for $slug"; exit 1; }
            sha256=${line%% *}
            [[ $sha256 =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256 for $slug"; exit 1; }
            echo "$line" > "dist/$slug-$VERSION.dmg.sha256"
            echo "sha256_$key=$sha256" >> "$GITHUB_OUTPUT"
          done
          lipo -info dist/Resources.app/Contents/MacOS/resources-mac "dist/Disk Sweep.app/Contents/MacOS/disk-sweep"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.sha256

  tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: VachaganGrigoryan/homebrew-tap
          # Deploy key with write access to homebrew-tap only.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update casks
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p tap/Casks
          scripts/cask.sh resources-mac "$VERSION" "${{ needs.build.outputs.sha256_resources }}" > tap/Casks/resources-mac.rb
          scripts/cask.sh disk-sweep "$VERSION" "${{ needs.build.outputs.sha256_sweep }}" > tap/Casks/disk-sweep.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/resources-mac.rb Casks/disk-sweep.rb
          git commit -m "resources-mac and disk-sweep $VERSION"
          git push
