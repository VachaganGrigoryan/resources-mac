name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Bundle universal app and dmg
        id: bundle
        run: |
          sha256=$(scripts/bundle.sh "${{ steps.version.outputs.version }}" | tail -1)
          echo "$sha256  resources-mac-${{ steps.version.outputs.version }}.dmg" > dist/resources-mac-${{ steps.version.outputs.version }}.dmg.sha256
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          lipo -info dist/Resources.app/Contents/MacOS/resources-mac

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.sha256

  tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: VachaganGrigoryan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update cask
        run: |
          mkdir -p tap/Casks
          scripts/cask.sh "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.sha256 }}" > tap/Casks/resources-mac.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/resources-mac.rb
          git commit -m "resources-mac ${{ needs.build.outputs.version }}"
          git push
