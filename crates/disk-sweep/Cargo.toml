[package]
name = "disk-sweep"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Disk clean-up for developer workspaces and Docker, in the Resources style"
repository = "https://github.com/VachaganGrigoryan/resources-mac"

[[bin]]
name = "disk-sweep"
path = "src/main.rs"

[dependencies]
resources-mac = { path = "../resources" }
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = "0.37"
ignore = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"
