[package]
name = "disk-sweep"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Disk clean-up for developer workspaces and Docker, in the Resources style"
repository.workspace = true

[[bin]]
name = "disk-sweep"
path = "src/main.rs"

[dependencies]
resources-ui.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
ignore = "0.4"
rfd = "0.17"
serde.workspace = true
serde_json = "1"
trash = "5"

[dev-dependencies]
resources-ui = { workspace = true, features = ["test-support"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
tempfile.workspace = true
