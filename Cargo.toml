[workspace]
resolver = "3"
members = ["crates/ui", "crates/resources", "crates/disk-sweep"]
# The website is its own Cargo project (own lockfile, own CI job).
exclude = ["site"]

# One version for the suite: a `v*` tag releases both apps.
[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/VachaganGrigoryan/resources-mac"

[workspace.dependencies]
resources-ui = { path = "crates/ui" }
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = "0.37"
egui_kittest = "0.37"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
