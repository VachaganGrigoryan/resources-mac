[package]
name = "resources-mac"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A macOS system monitor inspired by GNOME Resources"
repository = "https://github.com/VachaganGrigoryan/resources-mac"

[dependencies]
anyhow = "1"
core-foundation = "0.10"
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
io-kit-sys = "0.5"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "objc2-core-foundation", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
starship-battery = "0.12"
sysinfo = "0.39"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
lto = true
strip = true
